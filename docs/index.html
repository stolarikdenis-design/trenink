<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trénink</title>
<meta name="description" content="Denisův tréninkový deník: série, váhy, míry postavy, přehledy a PDF reporty.">
<meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trénink">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
/* Layout: one column of exercise cards (pictogram tile + name, big tappable set tiles, feeling row),
   sticky header with overall progress, rest timer docked at the bottom. */
:root {
  --bg: #e9ecef;
  --surface: #ffffff;
  --sunken: #f2f4f6;
  --ink: #15181c;
  --muted: #5f6873;
  --line: #cfd5db;
  --accent: #d0341f;       /* 25 kg plate red: "teď na řadě" */
  --accent-soft: #fbe6e2;
  --accent-ink: #ffffff;
  --good: #17834a;         /* odcvičeno */
  --good-soft: #dcf1e4;
  --good-ink: #ffffff;
  --warn: #c98a00;
  --warn-soft: #fbefd0;
  --hard: #c2412d;
  --hard-soft: #f9e1dc;
  --p25: #d0341f; --p20: #2457b8; --p15: #e0b021; --p10: #2f8a4c; --p5: #f4f4f4; --p25s: #3a3f45; --p125: #9aa2ab;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1215; --surface: #1a1e23; --sunken: #14171b; --ink: #eef1f4; --muted: #9aa4ae; --line: #2f363e;
    --accent: #ff5d43; --accent-soft: #3a1914; --accent-ink: #1a0805;
    --good: #3fc97c; --good-soft: #143524; --good-ink: #06140c;
    --warn: #f2b52e; --warn-soft: #3a2d0c; --hard: #ff7a62; --hard-soft: #3d1b15;
    --p5: #d9dcdf; --p25s: #59616a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1215; --surface: #1a1e23; --sunken: #14171b; --ink: #eef1f4; --muted: #9aa4ae; --line: #2f363e;
  --accent: #ff5d43; --accent-soft: #3a1914; --accent-ink: #1a0805;
  --good: #3fc97c; --good-soft: #143524; --good-ink: #06140c;
  --warn: #f2b52e; --warn-soft: #3a2d0c; --hard: #ff7a62; --hard-soft: #3d1b15;
  --p5: #d9dcdf; --p25s: #59616a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 150px; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font: 800 32px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 8px; }
h1 .plan { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 2px 8px 0; font-size: 24px; }
.store { font-size: 12px; color: var(--muted); text-align: right; }
.progress { display: flex; align-items: center; gap: 10px; }
.progress .track { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress .fill { height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.progress .num { font: 700 18px var(--display); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 2px; font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

main { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.intro { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: 16px; padding: 16px; border: 1px solid var(--line); }
.intro p { margin: 0; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 15px 18px; font: 800 21px var(--display); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); color: var(--good-ink); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 16px; padding: 11px 14px; }
.btn.ghost.armed { color: var(--hard); border-color: var(--hard); }

/* exercise card */
.ex { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.ex.now { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.ex.complete { border-color: var(--good); background: linear-gradient(var(--good-soft), var(--good-soft)) top / 100% 76px no-repeat, var(--surface); }
.ex-head { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.pic { width: 60px; height: 60px; border-radius: 14px; background: var(--sunken); color: var(--ink); display: grid; place-items: center; position: relative; }
.pic svg { width: 50px; height: 50px; }
.ex.now .pic { background: var(--accent); color: var(--accent-ink); }
.ex.complete .pic { background: var(--good); color: var(--good-ink); }
.pic .badge { position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--good); border: 2px solid var(--good); display: grid; place-items: center; }
.pic .badge svg { width: 14px; height: 14px; }
.ex h2 { font: 800 25px/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .02em; }
.ex .sub { font-size: 14px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.tag { font: 700 13px var(--display); letter-spacing: .1em; text-transform: uppercase; border-radius: 99px; padding: 4px 10px 3px; white-space: nowrap; }
.tag.now { background: var(--accent); color: var(--accent-ink); }
.tag.done { background: var(--good); color: var(--good-ink); }
.tag.left { background: var(--sunken); color: var(--muted); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.hint b { color: var(--ink); font-weight: 700; }
.hint.up b { color: var(--good); }
.load { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--sunken); }
.step button { border: 0; background: transparent; width: 44px; height: 44px; font-size: 22px; font-weight: 700; }
.step .val { min-width: 90px; text-align: center; font: 800 24px var(--display); font-variant-numeric: tabular-nums; padding: 0 4px; }
.bands { display: flex; gap: 6px; flex-wrap: wrap; }
.bands button { border: 1px solid var(--line); background: var(--sunken); border-radius: 99px; padding: 7px 13px; font-size: 14px; font-weight: 600; }
.bands button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plates { display: flex; align-items: center; gap: 2px; height: 36px; }
.plates .bar { width: 22px; height: 6px; background: var(--muted); border-radius: 2px; }
.plates i { display: block; width: 9px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); }
.plates small { margin-left: 8px; font-size: 12px; color: var(--muted); }

/* sets */
.sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.set { display: flex; flex-direction: column; gap: 6px; }
.tile { border: 2px dashed var(--line); background: var(--sunken); border-radius: 14px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 92px; justify-content: center; }
.tile .n { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile .r { font: 800 34px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.tile .cta { font-size: 12px; color: var(--muted); }
.tile.next { border-style: solid; border-color: var(--accent); background: var(--surface); }
.tile.next .r { color: var(--ink); }
.tile.next .cta { color: var(--accent); font-weight: 700; }
.tile.is-done { border: 2px solid var(--good); background: var(--good); color: var(--good-ink); }
.tile.is-done .n, .tile.is-done .r, .tile.is-done .cta { color: var(--good-ink); }
.tile.is-done .cta { display: flex; align-items: center; gap: 4px; font-weight: 700; }
.tile.is-done .cta svg { width: 14px; height: 14px; }
.tile.static { min-height: 70px; }
.tile .w { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .w.odd { color: var(--accent); }
.tile.is-done .w, .tile.is-done .w.odd { color: var(--good-ink); }
.mini { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mini button { border: 0; background: var(--sunken); height: 34px; font-size: 18px; font-weight: 700; color: var(--ink); }
.mini span { text-align: center; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.load-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.band-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q { font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.load { flex-direction: column; align-items: stretch; }

/* feeling */
.feel { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.feel .q { font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.faces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.faces button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
.faces svg { width: 26px; height: 26px; }
.faces button[data-f="easy"][aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.faces button[data-f="ok"][aria-pressed="true"] { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.faces button[data-f="hard"][aria-pressed="true"] { border-color: var(--hard); background: var(--hard-soft); color: var(--hard); }
.faces button[aria-pressed="true"] { font-weight: 700; }

.finish { display: flex; flex-direction: column; gap: 8px; }
.ex { scroll-margin-top: 150px; }
.set-tools { display: flex; gap: 14px; flex-wrap: wrap; margin-top: -4px; }
.hint.warm { font-size: 13px; }
.hint.err { color: var(--hard); font-weight: 600; }
.btn.add { background: var(--surface); color: var(--ink); border: 2px dashed var(--line); }
.addbox { border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .q { width: 100%; }
.chip { border: 1px solid var(--line); background: var(--sunken); border-radius: 99px; padding: 7px 12px; font-size: 14px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { font: 600 18px var(--body); color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
.load-row .field input { width: 150px; }
.field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
/* body */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font: 800 24px/1.05 var(--display); text-transform: uppercase; margin: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav button { border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; width: 40px; height: 40px; font-size: 20px; font-weight: 700; }
.nav button:disabled { opacity: .35; cursor: default; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.banner button { border: 0; background: var(--ink); color: var(--bg); border-radius: 9px; padding: 8px 12px; font: 700 15px var(--display); text-transform: uppercase; white-space: nowrap; }
.weight { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.figure { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: start; }
.figure svg { width: 110px; height: auto; }
.figure .sil { fill: var(--sunken); stroke: var(--line); }
.figure .tape { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.figure .bd circle { fill: var(--accent); }
.figure .bd text { fill: var(--accent-ink); font: 700 8.5px var(--body); }
.meas { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.m { display: grid; grid-template-columns: 22px minmax(0, 1fr) 74px; gap: 8px; align-items: center; }
.m .no { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 12px var(--body); display: grid; place-items: center; }
.m label { font-size: 14px; font-weight: 600; line-height: 1.15; min-width: 0; }
.m label small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.m input, .weight input { color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 8px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.m input { font: 700 18px var(--body); text-align: right; }
.weight input { font: 800 30px var(--display); width: 130px; }
.m input:focus-visible, .weight input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.gain { color: var(--good); font-weight: 700; } .loss { color: var(--hard); font-weight: 700; }
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.t th { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: right; padding: 4px 6px; white-space: nowrap; }
table.t td { border-top: 1px solid var(--line); padding: 6px; text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
/* overview */
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 9px 16px; font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.period { font: 700 20px var(--display); text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile2 { background: var(--sunken); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile2 .n { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.tile2 .v { font: 800 23px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.tile2 .d { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feelbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); }
.feelbar i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 18px; height: 18px; }
.chart svg { width: 100%; height: auto; }
.chart .bar { fill: var(--accent); }
.chart .grid { stroke: var(--line); }
.chart text { fill: var(--muted); font: 600 10px var(--body); }
.chart text.vl { fill: var(--ink); font-weight: 700; }
.pdfs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pdfs .btn { font-size: 17px; padding: 12px 10px; }
.add-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

/* timer */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--bg); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.timer .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.timer .t { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 94px; }
.timer .t.over { color: var(--accent); }
.timer .what { flex: 1; min-width: 0; font-size: 13px; opacity: .8; }
.timer button { background: transparent; color: var(--bg); border: 1px solid currentColor; border-radius: 9px; padding: 9px 11px; font: 700 15px var(--display); text-transform: uppercase; }

/* history */
.sec { font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 6px 0 0; }
.prs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; }
.pr svg { width: 34px; height: 34px; color: var(--muted); }
.pr .n { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.pr .v { font: 700 19px var(--display); font-variant-numeric: tabular-nums; }
.hist { display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day h3 { margin: 0; font: 700 21px var(--display); text-transform: uppercase; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 22px; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 5px; font-size: 14px; font-variant-numeric: tabular-nums; }
.row svg.ic { width: 26px; height: 26px; color: var(--muted); }
.row .val { color: var(--muted); text-align: right; }
.row .fc svg { width: 20px; height: 20px; }
.fc.easy { color: var(--good); } .fc.ok { color: var(--warn); } .fc.hard { color: var(--hard); }
.linkbtn { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }
.linkbtn.danger { color: var(--hard); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--good); color: var(--good-ink); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 9; }
@media (prefers-reduced-motion: no-preference) {
  .tile, .ex, .faces button { transition: background .15s, border-color .15s, box-shadow .15s; }
  .tile.pop { animation: pop .28s ease-out; }
  @keyframes pop { 40% { transform: scale(1.06); } }
}
.filebtn { display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plans button { border: 2px solid var(--line); background: var(--sunken); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; }
.plans b { font: 800 30px/1 var(--display); }
.plans span { font-size: 12.5px; line-height: 1.2; color: var(--muted); font-weight: 600; }
.plans i { font-style: normal; font: 700 11px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-top: 2px; }
.plans button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

function dbStore(col, get, set, order) {

const feelWord = f => f ? FACES[f].label.toLowerCase() : "";

async function makePdf(scope) {
  const lib = await getPdfLib(), P = pdfDoc(lib);

    const Pp = { ...periodOf(ov.mode, ov.offset), offset: ov.offset }, R = report(Pp);

  } else {
    const all = doneSessions(), st = statsOf(all);
    const first = all.length ? new Date(all[all.length - 1].startedAt) : new Date();
    P.h1("Kompletní report", `od ${first.toLocaleDateString("cs-CZ")} do ${new Date().toLocaleDateString("cs-CZ")}`);
    const bs = bodySorted().filter(b => b.weight != null);
    P.tiles([["Tréninky", st.n, ""], ["Série", st.sets, `${st.reps} opakování`], ["Objem", kgShort(st.vol), ""], ["Čas", `${Math.floor(st.mins / 60)} h ${st.mins % 60} min`, ""],
      ["Váha", bs.length ? fmt(bs[bs.length - 1].weight) + " kg" : "–", bs.length > 1 ? `od začátku ${bs[bs.length - 1].weight - bs[0].weight >= 0 ? "+" : "−"}${fmt(Math.abs(Math.round((bs[bs.length - 1].weight - bs[0].weight) * 10) / 10))} kg` : ""],
      ["Cviky", defsIn(all).filter(p => bestOf(p, all)).length, "s aspoň jednou sérií"]]);
    P.feel(st.feel);
    const months = []; for (let o = 0; ; o--) { const m = periodOf("month", o); if (m.to <= first && o < 0) break; months.push(m); if (o < -120) break; }
    P.h2("Po měsících");
    P.table(["Měsíc", "Tréninky", "Série", "Objem", "Čas", "Váha"], months.map(m => { const l = inPeriod(all, m), x = statsOf(l), b = bodyIn(m).filter(e => e.weight != null).pop();
      return [m.label, x.n, x.sets, kgShort(x.vol), x.mins + " min", b ? fmt(b.weight) + " kg" : "–"]; }), [26, 12, 10, 14, 12, 14], ["l", "r", "r", "r", "r", "r"]);
    P.h2("Nejlepší výkony");
    P.table(["Cvik", "Nejlepší série", "Kdy"], defsIn(all).map(p => { const v = bestOf(p, all); if (!v) return null;
      const when = all.slice().reverse().find(s => { const b = bestOf(p, [s]); return b && b.t === v.t; });
      return [p.name, v.txt, when ? new Date(when.startedAt).toLocaleDateString("cs-CZ") : ""]; }).filter(Boolean), [30, 30, 20], ["l", "l", "l"]);

}
/* save a generated file: claude.ai asks via downloads, the installed app shares or downloads */
async function saveFile(name, data, type) {
  if (IS_ARTIFACT) {
    const dl = await window.claude.use("downloads");
    if (!dl) throw { code: "unavailable" };
    await dl.save({ filename: name, data }); return "saved";
  }
  const blob = new Blob([data], { type });
  try {
    const file = new File([blob], name, { type });
    if (/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return "shared"; }
  } catch (e) { if (e && e.name === "AbortError") throw { code: "declined" }; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return "saved";
}
async function savePdf(scope, btn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Připravuju…";

    else { await saveFile(name, data, "application/pdf"); pdfMsg = `Hotovo, ${name}.`; }

document.getElementById("app").addEventListener("change", async e => {
  if (e.target.id !== "backup-file" || !e.target.files[0]) return;

document.getElementById("app").addEventListener("input", e => {

/* ---------- events ---------- */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; view = b.dataset.view; pendingDelete = null; render();
});
$("#app").addEventListener("input", e => {
  if (e.target.id === "add-name") draft.name = e.target.value;
  if (e.target.id === "add-kg") draft.kg = e.target.value;
});
$("#app").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".addbox")) { e.preventDefault(); $("#add-go") && $("#add-go").click(); } });
$("#app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "start") { const s = newSession(pickPlan || nextPlan()); pickPlan = null; sessions[s.id] = s; store.save(s); keepAwake(); try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch {} render(); window.scrollTo(0, 0); return; }
  if (b.id !== "discard") pendingDiscard = false;
  const s = active();

    s.finishedAt = new Date().toISOString(); store.save(s);

  }

    if (!pendingDiscard) { pendingDiscard = true; render(); return; }
    pendingDiscard = false; delete sessions[s.id]; store.remove(s.id); clearInterval(tInt); $("#timer").hidden = true; render(); return;
  }
  const act = b.dataset.act;
  if (act === "del") {
    if (pendingDelete !== b.dataset.id) { pendingDelete = b.dataset.id; render(); return; }
    delete sessions[pendingDelete]; store.remove(pendingDelete); pendingDelete = null; render(); return;
  }
  if (b.id === "add-open") { draft = { open: true, name: "", scheme: "8–12", sets: 3, kg: "" }; render(); $("#add-name") && $("#add-name").focus(); return; }
  if (b.id === "add-cancel") { draft.open = false; render(); return; }
  if (act === "scheme") { draft.scheme = b.dataset.s; render(); return; }
  if (act === "dsets") { draft.sets = Math.min(10, Math.max(1, draft.sets + +b.dataset.d)); render(); return; }
  if (act === "pick") {
    draft.name = b.dataset.name; draft.err = "";
    const d = customDefs().find(x => x.k === slug(draft.name));
    if (d) { draft.scheme = d.open ? "max" : (SCHEMES.find(x => x[1] === d.min && x[2] === d.max) || SCHEMES[1])[0]; draft.sets = d.sets; }
    render(); return;
  }

    if (!name) { draft.err = "Napiš název cviku nebo vyber návrh."; render(); return; }

    if (planOf(s).some(p => p.k === def.k)) { draft.err = "Tenhle cvik už v dnešním tréninku je."; render(); return; }
    const prev = customDefs().find(x => x.k === def.k);
    s.extra = (s.extra || []).concat(def);
    addEx(s, def);
    // keep the weight he typed; history only fills it when the field is empty

  if (act === "delex") { s.extra = (s.extra || []).filter(d => d.k !== p.k); delete s.ex[p.k]; if (s.hints) delete s.hints[p.k]; store.save(s); render(); return; }

    const old = ex.kg ?? null;
    ex.kg = stepKg(old, +b.dataset.d, p.inc);

  }
  if (act === "skg") { const x = ex.sets[+b.dataset.i]; x.kg = stepKg(kgOf(ex, x), +b.dataset.d, p.inc); }
  if (act === "band") ex.band = b.dataset.b;
  if (act === "feel") ex.feel = ex.feel === b.dataset.f ? null : b.dataset.f;
  if (act === "rep") { const x = ex.sets[+b.dataset.i]; x.reps = Math.max(0, x.reps + +b.dataset.d * (p.step || 1)); }
  if (act === "done") {

    if (f) f.focus({ preventScroll: true });
  }
});
